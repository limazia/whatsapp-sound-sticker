services:
  soundsticker:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_KEY: ${API_KEY:?Configure API_KEY em .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configure ADMIN_PASSWORD em .env}
      FRIEND_KEY: ${FRIEND_KEY:?Configure FRIEND_KEY em .env}
      NODE_ENV: development
      PORT: 3000
    volumes:
      - whatsapp-auth:/app/auth

volumes:
  whatsapp-auth:
